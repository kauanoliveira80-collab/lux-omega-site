<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>LUX-Omega AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #f4f4f8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #14141f;
      border-bottom: 1px solid #26263a;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1.2rem; color: #7c5cff; display: inline; }
    .status { font-size: 0.8rem; color: #facc15; margin-left: 8px; }
    .header-btns { display: flex; gap: 8px; }
    button {
      background: #7c5cff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #26263a; }
    #config-panel {
      background: #14141f;
      border-bottom: 1px solid #26263a;
      padding: 16px 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    label { font-size: 0.82rem; color: #a0a0b8; }
    input {
      background: #0a0a0f;
      border: 1px solid #2e2e46;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      width: 100%;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { background: #7c5cff; align-self: flex-end; }
    .ai { background: #181826; border: 1px solid #26263a; align-self: flex-start; }
    form {
      background: #14141f;
      border-top: 1px solid #26263a;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LUX-Omega</h1>
      <span class="status" id="mode-badge">● Sincronizando canal...</span>
    </div>
    <div class="header-btns">
      <button class="secondary" onclick="syncNtfy()">Sincronizar</button>
      <button class="secondary" onclick="toggleConfig()">Configurar</button>
    </div>
  </header>

  <div id="config-panel">
    <label>Canal ntfy (sincronização automática do Colab):</label>
    <input type="text" id="ntfy-channel" value="lux-omega-kauan-v55">

    <label>Link do Google Colab (preenchido automaticamente pelo canal):</label>
    <input type="url" id="colab-url" placeholder="https://xxxx.trycloudflare.com">

    <label>Rota da API no Colab (ex: /executar ou /chat):</label>
    <input type="text" id="colab-route" placeholder="/executar">

    <label>Chave API do Gemini (reserva se o Colab estiver desligado):</label>
    <input type="password" id="api-key" placeholder="AIza...">

    <button onclick="saveConfig()">Salvar Conexão</button>
  </div>

  <div id="chat">
    <div class="msg ai">Buscando link ativo do Colab no canal lux-omega-kauan-v55...</div>
  </div>

  <form onsubmit="sendMessage(event)">
    <input type="text" id="prompt" placeholder="Envie um comando para o LUX-Omega..." autocomplete="off" required>
    <button type="submit" id="send-btn">Enviar</button>
  </form>

  <script>
    const ntfyInput = document.getElementById('ntfy-channel');
    const colabInput = document.getElementById('colab-url');
    const routeInput = document.getElementById('colab-route');
    const keyInput = document.getElementById('api-key');
    const badge = document.getElementById('mode-badge');
    const chat = document.getElementById('chat');

    ntfyInput.value = localStorage.getItem('lux_ntfy_channel') || 'lux-omega-kauan-v55';
    colabInput.value = localStorage.getItem('lux_colab_url') || '';
    routeInput.value = localStorage.getItem('lux_colab_route') || '/executar';
    keyInput.value = localStorage.getItem('lux_api_key') || '';

    function updateBadge(statusText, color) {
      if (statusText) {
        badge.textContent = statusText;
        badge.style.color = color;
        return;
      }
      if (localStorage.getItem('lux_colab_url')) {
        badge.textContent = '● Colab Sincronizado';
        badge.style.color = '#4ade80';
      } else if (localStorage.getItem('lux_api_key')) {
        badge.textContent = '● Gemini API';
        badge.style.color = '#60a5fa';
      } else {
        badge.textContent = '● Desconectado';
        badge.style.color = '#f87171';
      }
    }

    function toggleConfig() {
      const panel = document.getElementById('config-panel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveConfig() {
      localStorage.setItem('lux_ntfy_channel', ntfyInput.value.trim());
      localStorage.setItem('lux_colab_url', colabInput.value.trim().replace(/\/$/, ''));
      localStorage.setItem('lux_colab_route', routeInput.value.trim() || '/executar');
      localStorage.setItem('lux_api_key', keyInput.value.trim());
      updateBadge();
      toggleConfig();
      addMessage('Configurações salvas.', 'ai');
    }

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function extractTunnelUrl(text) {
      const matches = text.match(/https:\/\/[a-zA-Z0-9-]+\.trycloudflare\.com/g);
      return matches ? matches[matches.length - 1] : null;
    }

    async function syncNtfy(silent = false) {
      const channel = (localStorage.getItem('lux_ntfy_channel') || 'lux-omega-kauan-v55').trim();
      if (!channel) return;
      updateBadge('● Sincronizando...', '#facc15');
      try {
        const res = await fetch(`https://ntfy.sh/${encodeURIComponent(channel)}/json?poll=1&since=24h`);
        const raw = await res.text();
        let latestUrl = null;
        for (const line of raw.split('
')) {
          if (!line.trim()) continue;
          try {
            const evt = JSON.parse(line);
            const found = extractTunnelUrl(JSON.stringify(evt));
            if (found) latestUrl = found;
          } catch (_) {}
        }
        if (latestUrl) {
          const prev = localStorage.getItem('lux_colab_url');
          localStorage.setItem('lux_colab_url', latestUrl);
          colabInput.value = latestUrl;
          updateBadge();
          if (!silent || prev !== latestUrl) {
            addMessage(`Colab conectado automaticamente:
${latestUrl}`, 'ai');
          }
        } else {
          updateBadge();
          if (!silent) addMessage('Nenhum link novo encontrado no canal nas últimas 24h.', 'ai');
        }
      } catch (e) {
        updateBadge();
        if (!silent) addMessage('Erro ao ler canal ntfy: ' + e.message, 'ai');
      }
    }

    function listenNtfyLive() {
      const channel = (localStorage.getItem('lux_ntfy_channel') || 'lux-omega-kauan-v55').trim();
      if (!channel) return;
      const es = new EventSource(`https://ntfy.sh/${encodeURIComponent(channel)}/sse`);
      es.onmessage = (event) => {
        const found = extractTunnelUrl(event.data);
        if (found && found !== localStorage.getItem('lux_colab_url')) {
          localStorage.setItem('lux_colab_url', found);
          colabInput.value = found;
          updateBadge();
          addMessage(`Novo túnel do Colab detectado ao vivo:
${found}`, 'ai');
        }
      };
    }

    async function sendMessage(e) {
      e.preventDefault();
      const colabUrl = localStorage.getItem('lux_colab_url');
      const route = localStorage.getItem('lux_colab_route') || '/executar';
      const apiKey = localStorage.getItem('lux_api_key');

      if (!colabUrl && !apiKey) {
        toggleConfig();
        return alert('Aguarde a sincronização ou configure o motor.');
      }

      const input = document.getElementById('prompt');
      const btn = document.getElementById('send-btn');
      const userText = input.value.trim();
      if (!userText) return;

      addMessage(userText, 'user');
      input.value = '';
      btn.disabled = true;
      const loadingMsg = addMessage('Processando no LUX-Omega...', 'ai');

      try {
        if (colabUrl) {
          const endpoint = route.startsWith('/') ? route : `/${route}`;
          const res = await fetch(`${colabUrl}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: userText, message: userText, text: userText })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
          loadingMsg.textContent = data.reply || data.response || data.output || JSON.stringify(data, null, 2);
        } else {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: userText }] }] })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Erro na API');
          loadingMsg.textContent = data.candidates[0].content.parts[0].text;
        }
      } catch (err) {
        loadingMsg.textContent = `Falha (${err.message}). Clique em "Sincronizar" no topo se o Colab reiniciou.`;
      } finally {
        btn.disabled = false;
      }
    }

    updateBadge();
    syncNtfy(true);
    listenNtfyLive();
  </script>
</body>
</html>

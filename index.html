<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUX-Ω Omni v5 Turbo — Painel & Hub</title>
  <style>
    :root {
      --bg: #08090e;
      --panel: #11131d;
      --panel-2: #171a28;
      --border: #25293d;
      --text: #f3f5fc;
      --muted: #9aa2be;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --ok: #4ade80;
      --warn: #facc15;
      --err: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .pill {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--warn);
    }
    .pill.ok { color: var(--ok); border-color: rgba(74,222,128,0.35); }
    .pill.err { color: var(--err); border-color: rgba(248,113,113,0.35); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .btn-link {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.secondary, .btn-link.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.warn { background: #b45309; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .tabs {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 18px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border-radius: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    #config-bar {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.76rem; color: var(--muted); }
    input, select, textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.88rem;
      width: 100%;
    }
    textarea { min-height: 84px; resize: vertical; }
    main {
      flex: 1;
      padding: 18px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .view { display: none; flex-direction: column; gap: 14px; }
    .view.active { display: flex; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .chat-box {
      min-height: 300px;
      max-height: 460px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 86%;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }
    .msg.user { background: var(--accent); align-self: flex-end; }
    .msg.ai { background: var(--panel-2); border: 1px solid var(--border); align-self: flex-start; }
    .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .kv { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .kv .k { font-size: 0.74rem; color: var(--muted); }
    .kv .v { font-size: 0.95rem; font-weight: 600; margin-top: 2px; word-break: break-all; }
    iframe.app-frame {
      width: 100%;
      height: 68vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #050609;
    }
    pre.log-box {
      background: #06070b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      overflow-x: auto;
      max-height: 340px;
    }
    .media-preview { margin-top: 8px; max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>LUX-Ω v5 Turbo</h1>
      <span id="conn-pill" class="pill">● Sincronizando...</span>
      <span id="gpu-pill" class="pill">GPU: --</span>
      <span id="comfy-pill" class="pill">Comfy (8188): --</span>
    </div>
    <div class="actions">
      <button class="secondary" onclick="syncNtfy(false)">📡 Sincronizar</button>
      <button class="warn" onclick="freeVram()">🧹 Liberar VRAM</button>
      <button class="secondary" onclick="toggleConfig()">⚙️ Config</button>
    </div>
  </header>

  <div id="config-bar">
    <div class="field">
      <label>Canal ntfy.sh</label>
      <input id="cfg-ntfy" type="text" value="lux-omega-kauan-v55" />
    </div>
    <div class="field">
      <label>URL Pública da API (Porta 8000)</label>
      <input id="cfg-api" type="url" placeholder="https://..." />
    </div>
    <div class="field">
      <label>URL Pública ComfyUI (Porta 8188)</label>
      <input id="cfg-comfy" type="url" placeholder="https://..." />
    </div>
    <div class="field">
      <label>URL Pública CreativeField</label>
      <input id="cfg-cf" type="url" placeholder="https://..." />
    </div>
    <div class="field" style="justify-content: flex-end;">
      <button onclick="saveConfig()">Salvar & Testar</button>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">💬 Chat & /run</button>
    <button class="tab-btn" data-tab="media" onclick="switchTab('media')">🎬 Dublagem / Voz / Rosto</button>
    <button class="tab-btn" data-tab="comfy" onclick="switchTab('comfy')">🧩 ComfyUI</button>
    <button class="tab-btn" data-tab="cf" onclick="switchTab('cf')">🎨 CreativeField</button>
    <button class="tab-btn" data-tab="jobs" onclick="switchTab('jobs')">📊 Status & Jobs</button>
  </nav>

  <main>
    <!-- ABA 1: CHAT & /RUN -->
    <section id="view-chat" class="view active">
      <div class="card">
        <div class="row-flex">
          <select id="run-tool" style="max-width: 210px;" onchange="onToolChange()">
            <option value="llm_gpu">LLM GPU (/run)</option>
            <option value="image_gpu">Imagem GPU (/run)</option>
            <option value="video_gpu">Vídeo GPU Wan/LTX (/run)</option>
            <option value="tts">TTS Edge (/run)</option>
            <option value="whisper">Whisper + RAG (/run)</option>
            <option value="crawl4ai">Crawl4AI + RAG (/run)</option>
            <option value="python">Python Exec (/run)</option>
          </select>
          <input id="run-extra" type="text" style="max-width: 280px;" placeholder="Modelo LLM / Engine / URL / Código..." />
          <span id="last-job-label" style="font-size: 0.82rem; color: var(--muted);">Job: nenhum</span>
        </div>
        <div id="chat-box" class="chat-box">
          <div class="msg ai">Pronto. Clique em Sincronizar para puxar o link ativo do Colab no canal ntfy.sh.</div>
        </div>
        <form class="row-flex" onsubmit="submitRun(event)">
          <input id="run-prompt" type="text" placeholder="Digite o prompt, texto TTS, URL ou instrução..." required style="flex: 1; min-width: 220px;" />
          <button id="run-send-btn" type="submit">Executar</button>
        </form>
      </div>
    </section>

    <!-- ABA 2: DUBLAGEM / VOZ / ROSTO -->
    <section id="view-media" class="view">
      <div class="grid-2">
        <div class="card">
          <h3>🎭 Dublagem Completa (/dub_video)</h3>
          <div class="field"><label>Vídeo de entrada</label><input id="dub-video" type="file" accept="video/*" /></div>
          <div class="field"><label>Alvo de rosto (nome para buscar imagem)</label><input id="dub-target" type="text" placeholder="Ex: Keanu Reeves" /></div>
          <div class="field"><label>Texto para clonagem de voz / fala</label><textarea id="dub-text" placeholder="Texto a falar no vídeo..."></textarea></div>
          <div class="field"><label>Idioma</label><input id="dub-lang" type="text" value="pt" /></div>
          <div class="field"><label>Áudio de referência (opcional)</label><input id="dub-voice-ref" type="file" accept="audio/*,video/*" /></div>
          <button onclick="sendDubVideo()">Enviar /dub_video</button>
          <div id="dub-result"></div>
        </div>

        <div class="card">
          <h3>🎙️ Clonagem de Voz (/voice_clone) & 🔄 Rosto (/face_swap)</h3>
          <div class="field"><label>Texto para voz</label><input id="vc-text" type="text" placeholder="Olá, teste de voz..." /></div>
          <div class="row-flex">
            <input id="vc-lang" type="text" value="pt" style="max-width: 90px;" />
            <input id="vc-engine" type="text" value="xtts" style="max-width: 120px;" />
            <button onclick="sendVoiceClone()">Gerar Voz</button>
          </div>
          <div id="vc-result"></div>
          <hr style="border-color: var(--border); margin: 6px 0;" />
          <div class="field"><label>Arquivo de mídia (imagem ou vídeo)</label><input id="fs-media" type="file" accept="image/*,video/*" /></div>
          <div class="field"><label>Rosto de referência (opcional)</label><input id="fs-face" type="file" accept="image/*" /></div>
          <div class="field"><label>Nome alvo (opcional)</label><input id="fs-target" type="text" placeholder="Nome do rosto..." /></div>
          <button onclick="sendFaceSwap()">Enviar /face_swap</button>
          <div id="fs-result"></div>
        </div>
      </div>
    </section>

    <!-- ABA 3: COMFYUI -->
    <section id="view-comfy" class="view">
      <div class="card">
        <div class="row-flex">
          <input id="comfy-url-input" type="url" placeholder="https://... (URL da porta 8188)" style="flex: 1;" />
          <button onclick="applyIframeUrl('comfy')">Carregar Painel</button>
          <a id="comfy-ext-link" class="btn-link secondary" href="#" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
        </div>
        <iframe id="comfy-frame" class="app-frame" src="about:blank"></iframe>
      </div>
    </section>

    <!-- ABA 4: CREATIVEFIELD -->
    <section id="view-cf" class="view">
      <div class="card">
        <div class="row-flex">
          <input id="cf-url-input" type="url" placeholder="https://... (URL do CreativeField)" style="flex: 1;" />
          <button onclick="applyIframeUrl('cf')">Carregar Painel</button>
          <a id="cf-ext-link" class="btn-link secondary" href="#" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
        </div>
        <iframe id="cf-frame" class="app-frame" src="about:blank"></iframe>
      </div>
    </section>

    <!-- ABA 5: STATUS & JOBS -->
    <section id="view-jobs" class="view">
      <div class="card">
        <div class="row-flex">
          <button onclick="refreshStatus()">Atualizar /status</button>
          <input id="job-lookup-id" type="text" placeholder="ID do job (ex: a1b2c3d4)" style="max-width: 220px;" />
          <button class="secondary" onclick="lookupJob()">Consultar /jobs/{id}</button>
        </div>
        <div class="status-grid" id="status-cards"></div>
        <pre id="status-json" class="log-box">{}</pre>
      </div>
    </section>
  </main>

  <script>
    const els = {
      ntfy: document.getElementById('cfg-ntfy'),
      api: document.getElementById('cfg-api'),
      comfy: document.getElementById('cfg-comfy'),
      cf: document.getElementById('cfg-cf'),
      connPill: document.getElementById('conn-pill'),
      gpuPill: document.getElementById('gpu-pill'),
      comfyPill: document.getElementById('comfy-pill'),
      chatBox: document.getElementById('chat-box'),
      runTool: document.getElementById('run-tool'),
      runExtra: document.getElementById('run-extra'),
      runPrompt: document.getElementById('run-prompt'),
      runSendBtn: document.getElementById('run-send-btn'),
      lastJobLabel: document.getElementById('last-job-label'),
      statusCards: document.getElementById('status-cards'),
      statusJson: document.getElementById('status-json'),
      jobLookupId: document.getElementById('job-lookup-id'),
      comfyUrlInput: document.getElementById('comfy-url-input'),
      cfUrlInput: document.getElementById('cf-url-input'),
      comfyFrame: document.getElementById('comfy-frame'),
      cfFrame: document.getElementById('cf-frame'),
      comfyExtLink: document.getElementById('comfy-ext-link'),
      cfExtLink: document.getElementById('cf-ext-link'),
    };

    function cleanUrl(u) {
      return (u || '').trim().replace(/\/+$/, '');
    }

    function loadSaved() {
      els.ntfy.value = localStorage.getItem('lux_ntfy') || 'lux-omega-kauan-v55';
      els.api.value = localStorage.getItem('lux_api_url') || '';
      els.comfy.value = localStorage.getItem('lux_comfy_url') || '';
      els.cf.value = localStorage.getItem('lux_cf_url') || '';
      els.comfyUrlInput.value = els.comfy.value;
      els.cfUrlInput.value = els.cf.value;
      syncExternalLinks();
    }

    function syncExternalLinks() {
      const cUrl = cleanUrl(els.comfy.value);
      const fUrl = cleanUrl(els.cf.value);
      els.comfyExtLink.href = cUrl || '#';
      els.cfExtLink.href = fUrl || '#';
    }

    function saveConfig() {
      localStorage.setItem('lux_ntfy', els.ntfy.value.trim() || 'lux-omega-kauan-v55');
      localStorage.setItem('lux_api_url', cleanUrl(els.api.value));
      localStorage.setItem('lux_comfy_url', cleanUrl(els.comfy.value));
      localStorage.setItem('lux_cf_url', cleanUrl(els.cf.value));
      els.comfyUrlInput.value = cleanUrl(els.comfy.value);
      els.cfUrlInput.value = cleanUrl(els.cf.value);
      syncExternalLinks();
      document.getElementById('config-bar').style.display = 'none';
      refreshStatus();
    }

    function toggleConfig() {
      const bar = document.getElementById('config-bar');
      bar.style.display = bar.style.display === 'none' || !bar.style.display ? 'grid' : 'none';
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === `view-${name}`));
      if (name === 'jobs') refreshStatus();
    }

    function applyIframeUrl(kind) {
      if (kind === 'comfy') {
        const u = cleanUrl(els.comfyUrlInput.value);
        els.comfy.value = u;
        localStorage.setItem('lux_comfy_url', u);
        syncExternalLinks();
        els.comfyFrame.src = u || 'about:blank';
      } else {
        const u = cleanUrl(els.cfUrlInput.value);
        els.cf.value = u;
        localStorage.setItem('lux_cf_url', u);
        syncExternalLinks();
        els.cfFrame.src = u || 'about:blank';
      }
    }

    function addMsg(text, who = 'ai') {
      const div = document.createElement('div');
      div.className = `msg ${who}`;
      div.textContent = text;
      els.chatBox.appendChild(div);
      els.chatBox.scrollTop = els.chatBox.scrollHeight;
      return div;
    }

    function onToolChange() {
      const t = els.runTool.value;
      if (t === 'llm_gpu') els.runExtra.placeholder = 'Modelo LLM (opcional, ex: Qwen/Qwen2.5-3B-Instruct)';
      else if (t === 'image_gpu' || t === 'video_gpu') els.runExtra.placeholder = 'Engine (wan, ltx, sdxl_lightning, flux_schnell)';
      else if (t === 'whisper' || t === 'crawl4ai') els.runExtra.placeholder = 'URL alvo';
      else if (t === 'python') els.runExtra.placeholder = 'Código Python curto (opcional)';
      else els.runExtra.placeholder = 'Parâmetro extra (opcional)';
    }

    function extractUrlsFromPayload(rawStr) {
      const out = { api: null, comfy: null, cf: null };
      try {
        const obj = JSON.parse(rawStr);
        const msgStr = typeof obj.message === 'string' ? obj.message : rawStr;
        try {
          const parsedInner = JSON.parse(msgStr);
          if (parsedInner.api_url) out.api = parsedInner.api_url;
          if (parsedInner.comfy_url) out.comfy = parsedInner.comfy_url;
          if (parsedInner.creativefield_url) out.cf = parsedInner.creativefield_url;
        } catch (_) {}
        const allUrls = (rawStr + ' ' + msgStr).match(/https?:\/\/[^\s"'<>]+|http?:\/\/bore\.pub:\d+/g) || [];
        if (!out.api && allUrls.length) out.api = allUrls[0];
        if (!out.comfy && allUrls.length > 1) out.comfy = allUrls[1];
        if (!out.cf && allUrls.length > 2) out.cf = allUrls[2];
      } catch (_) {}
      return out;
    }

    async function syncNtfy(silent = true) {
      const ch = (els.ntfy.value || 'lux-omega-kauan-v55').trim();
      els.connPill.className = 'pill';
      els.connPill.textContent = '● Sincronizando...';
      try {
        const res = await fetch(`https://ntfy.sh/${encodeURIComponent(ch)}/json?poll=1&since=24h`);
        const txt = await res.text();
        let found = { api: null, comfy: null, cf: null };
        for (const line of txt.split('
')) {
          if (!line.trim()) continue;
          const u = extractUrlsFromPayload(line);
          if (u.api) found.api = cleanUrl(u.api);
          if (u.comfy) found.comfy = cleanUrl(u.comfy);
          if (u.cf) found.cf = cleanUrl(u.cf);
        }
        let changed = false;
        if (found.api) { els.api.value = found.api; localStorage.setItem('lux_api_url', found.api); changed = true; }
        if (found.comfy) { els.comfy.value = found.comfy; els.comfyUrlInput.value = found.comfy; localStorage.setItem('lux_comfy_url', found.comfy); changed = true; }
        if (found.cf) { els.cf.value = found.cf; els.cfUrlInput.value = found.cf; localStorage.setItem('lux_cf_url', found.cf); changed = true; }
        syncExternalLinks();
        await refreshStatus();
        if (!silent) {
          addMsg(changed ? `Sincronizado com sucesso:
API: ${found.api || '(mantida)'}` : 'Nenhuma URL nova encontrada nas últimas 24h no canal ntfy.', 'ai');
        }
      } catch (e) {
        els.connPill.className = 'pill err';
        els.connPill.textContent = '● Sem conexão';
        if (!silent) addMsg(`Falha ao sincronizar ntfy: ${e.message}`, 'ai');
      }
    }

    async function refreshStatus() {
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) {
        els.connPill.className = 'pill err';
        els.connPill.textContent = '● API não configurada';
        return;
      }
      try {
        const res = await fetch(`${apiBase}/status`);
        const data = await res.json();
        els.connPill.className = 'pill ok';
        els.connPill.textContent = '● API Online';
        els.gpuPill.textContent = `GPU: ${data.gpu_name || 'CPU'} (${data.free_vram_gb ?? '--'}/${data.total_vram_gb ?? '--'} GB)`;
        els.comfyPill.textContent = `Comfy (8188): ${data.comfy_8188 ? 'ON' : 'OFF'}`;
        els.statusJson.textContent = JSON.stringify(data, null, 2);
        els.statusCards.innerHTML = [
          ['GPU', data.gpu_name || 'CPU'],
          ['VRAM Livre / Total', `${data.free_vram_gb ?? '--'} / ${data.total_vram_gb ?? '--'} GB`],
          ['Modo A100', String(Boolean(data.is_a100))],
          ['ComfyUI (8188)', data.comfy_8188 ? 'Ativo' : 'Inativo'],
          ['Túnel', `${data.tunnel_provider || 'none'}`],
          ['Pipeline Ativo', data.active_pipeline || 'nenhum'],
        ].map(([k, v]) => `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
      } catch (e) {
        els.connPill.className = 'pill err';
        els.connPill.textContent = '● API Offline';
        els.statusJson.textContent = `Erro ao consultar /status: ${e.message}`;
      }
    }

    async function freeVram() {
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) return alert('Configure a URL da API primeiro.');
      const res = await fetch(`${apiBase}/free_vram`, { method: 'POST' });
      const data = await res.json();
      addMsg(`VRAM atualizada:
${JSON.stringify(data.gpu || data, null, 2)}`, 'ai');
      refreshStatus();
    }

    async function pollJob(jobId, bubble) {
      const apiBase = cleanUrl(els.api.value);
      for (let i = 0; i < 180; i++) {
        await new Promise(r => setTimeout(r, 1500));
        const res = await fetch(`${apiBase}/jobs/${jobId}`);
        const job = await res.json();
        if (job.status === 'completed' || job.status === 'failed') {
          return job;
        }
        bubble.textContent = `Job ${jobId} (${job.status || 'running'})...`;
      }
      return { ok: false, status: 'timeout', error: 'Tempo limite de espera no polling.' };
    }

    function renderMediaInto(container, apiBase, job) {
      if (!job || !job.url) return;
      const fullUrl = job.url.startsWith('http') ? job.url : `${apiBase}${job.url}`;
      if (job.type === 'video') {
        container.innerHTML = `<video class="media-preview" controls src="${fullUrl}"></video><div style="font-size:0.8rem;margin-top:4px;"><a href="${fullUrl}" target="_blank" style="color:var(--accent-2);">Abrir vídeo ↗</a></div>`;
      } else if (job.type === 'audio') {
        container.innerHTML = `<audio class="media-preview" controls src="${fullUrl}"></audio><div style="font-size:0.8rem;margin-top:4px;"><a href="${fullUrl}" target="_blank" style="color:var(--accent-2);">Baixar áudio ↗</a></div>`;
      } else if (job.type === 'image') {
        container.innerHTML = `<img class="media-preview" src="${fullUrl}" alt="Resultado" />`;
      }
    }

    async function submitRun(e) {
      e.preventDefault();
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) return alert('Configure ou sincronize a URL da API primeiro.');

      const tool = els.runTool.value;
      const prompt = els.runPrompt.value.trim();
      const extra = els.runExtra.value.trim();
      if (!prompt) return;

      addMsg(`[${tool}] ${prompt}`, 'user');
      els.runPrompt.value = '';
      els.runSendBtn.disabled = true;
      const bubble = addMsg('Enviando tarefa para /run...', 'ai');

      const params = { prompt, text: prompt, url: extra || prompt };
      if (tool === 'llm_gpu' && extra) params.model = extra;
      if ((tool === 'image_gpu' || tool === 'video_gpu') && extra) params.engine = extra;
      if (tool === 'python') params.code = extra || prompt;

      try {
        const res = await fetch(`${apiBase}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool, params }),
        });
        const queued = await res.json();
        const jobId = queued.job_id;
        els.lastJobLabel.textContent = `Job: ${jobId}`;
        els.jobLookupId.value = jobId;
        const finalJob = await pollJob(jobId, bubble);
        bubble.textContent = finalJob.text || finalJob.stdout || finalJob.error || JSON.stringify(finalJob, null, 2);
        renderMediaInto(bubble, apiBase, finalJob);
      } catch (err) {
        bubble.textContent = `Erro: ${err.message}`;
      } finally {
        els.runSendBtn.disabled = false;
      }
    }

    async function sendDubVideo() {
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) return alert('Configure a URL da API primeiro.');
      const vid = document.getElementById('dub-video').files[0];
      if (!vid) return alert('Selecione um arquivo de vídeo.');
      const fd = new FormData();
      fd.append('video_file', vid);
      fd.append('target_name', document.getElementById('dub-target').value.trim());
      fd.append('text', document.getElementById('dub-text').value.trim());
      fd.append('language', document.getElementById('dub-lang').value.trim() || 'pt');
      const vRef = document.getElementById('dub-voice-ref').files[0];
      if (vRef) fd.append('voice_file', vRef);

      const targetDiv = document.getElementById('dub-result');
      targetDiv.textContent = 'Processando /dub_video...';
      const res = await fetch(`${apiBase}/dub_video`, { method: 'POST', body: fd });
      const data = await res.json();
      targetDiv.innerHTML = `<pre class="log-box">${JSON.stringify(data, null, 2)}</pre>`;
      renderMediaInto(targetDiv, apiBase, data);
    }

    async function sendVoiceClone() {
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) return alert('Configure a URL da API primeiro.');
      const fd = new FormData();
      fd.append('text', document.getElementById('vc-text').value.trim());
      fd.append('language', document.getElementById('vc-lang').value.trim() || 'pt');
      fd.append('engine', document.getElementById('vc-engine').value.trim() || 'xtts');
      const targetDiv = document.getElementById('vc-result');
      targetDiv.textContent = 'Gerando voz...';
      const res = await fetch(`${apiBase}/voice_clone`, { method: 'POST', body: fd });
      const data = await res.json();
      targetDiv.innerHTML = `<pre class="log-box">${JSON.stringify(data, null, 2)}</pre>`;
      renderMediaInto(targetDiv, apiBase, data);
    }

    async function sendFaceSwap() {
      const apiBase = cleanUrl(els.api.value);
      if (!apiBase) return alert('Configure a URL da API primeiro.');
      const media = document.getElementById('fs-media').files[0];
      if (!media) return alert('Selecione imagem ou vídeo.');
      const fd = new FormData();
      fd.append('media_file', media);
      fd.append('target_name', document.getElementById('fs-target').value.trim());
      const face = document.getElementById('fs-face').files[0];
      if (face) fd.append('face_file', face);
      const targetDiv = document.getElementById('fs-result');
      targetDiv.textContent = 'Enviando /face_swap...';
      const res = await fetch(`${apiBase}/face_swap`, { method: 'POST', body: fd });
      const data = await res.json();
      targetDiv.innerHTML = `<pre class="log-box">${JSON.stringify(data, null, 2)}</pre>`;
      renderMediaInto(targetDiv, apiBase, data);
    }

    async function lookupJob() {
      const apiBase = cleanUrl(els.api.value);
      const jid = els.jobLookupId.value.trim();
      if (!apiBase || !jid) return;
      const res = await fetch(`${apiBase}/jobs/${jid}`);
      const data = await res.json();
      els.statusJson.textContent = JSON.stringify(data, null, 2);
    }

    loadSaved();
    syncNtfy(true);
  </script>
</body>

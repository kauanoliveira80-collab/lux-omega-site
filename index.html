<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>LUX-Omega</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #f4f4f8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #14141f;
      border: 1px solid #26263a;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; color: #7c5cff; }
    p { color: #a0a0b8; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LUX-Omega</h1>
    <p>Site público publicado e funcionando online.</p>
  </div>
</body>
</html>

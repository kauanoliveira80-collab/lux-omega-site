<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUX-Omega</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #0b0d14;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #141824;
      border-bottom: 1px solid #262d42;
      position: relative;
      z-index: 10;
    }
    .title-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title-wrap h1 { font-size: 1.1rem; color: #a78bfa; }
    #status-txt { font-size: 0.85rem; color: #facc15; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      appearance: none;
      -webkit-appearance: none;
      background: #7c3aed;
      color: #ffffff;
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto !important;
      position: relative;
      z-index: 20;
    }
    button:hover { background: #6d28d9; }
    button.sec { background: #1f2536; border-color: #333d58; }
    button.sec:hover { background: #293147; }
    #cfg-box {
      display: none;
      padding: 14px 16px;
      background: #141824;
      border-bottom: 1px solid #262d42;
      position: relative;
      z-index: 15;
    }
    #cfg-box.open { display: block; }
    .cfg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    label { display: block; font-size: 0.78rem; color: #9ca3af; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #0b0d14;
      color: #ffffff;
      border: 1px solid #333d58;
      border-radius: 8px;
      font-size: 0.95rem;
      pointer-events: auto !important;
    }
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 2;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
    }
    .msg.u { background: #7c3aed; align-self: flex-end; }
    .msg.a { background: #181d2c; border: 1px solid #262d42; align-self: flex-start; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #141824;
      border-top: 1px solid #262d42;
      position: relative;
      z-index: 10;
    }
    #prompt-inp { flex: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title-wrap">
        <h1>LUX-Omega</h1>
        <span id="status-txt">Aguardando sincronização</span>
      </div>
      <div class="btn-row">
        <button type="button" class="sec" id="btn-sync">Sincronizar</button>
        <button type="button" class="sec" id="btn-cfg">Configurar</button>
        <button type="button" class="sec" id="btn-test">Testar /health</button>
      </div>
    </div>

    <div id="cfg-box">
      <div class="cfg-grid">
        <div>
          <label for="inp-ntfy">Canal ntfy.sh</label>
          <input type="text" id="inp-ntfy" value="lux-omega-kauan-v55" />
        </div>
        <div>
          <label for="inp-url">URL do Colab / Túnel</label>
          <input type="url" id="inp-url" placeholder="https://xxxx.trycloudflare.com" />
        </div>
        <div>
          <label for="inp-route">Rota</label>
          <input type="text" id="inp-route" value="/executar" />
        </div>
      </div>
      <button type="button" id="btn-save">Salvar</button>
    </div>

    <div id="msgs">
      <div class="msg a">Painel pronto. Clique em "Sincronizar" ou em "Configurar" para colar a URL do túnel.</div>
    </div>

    <div class="composer">
      <input type="text" id="prompt-inp" placeholder="Digite sua mensagem e pressione Enviar..." />
      <button type="button" id="btn-send">Enviar</button>
    </div>
  </div>

  <script>
    (function () {
      const elStatus = document.getElementById('status-txt');
      const elCfgBox = document.getElementById('cfg-box');
      const elNtfy = document.getElementById('inp-ntfy');
      const elUrl = document.getElementById('inp-url');
      const elRoute = document.getElementById('inp-route');
      const elMsgs = document.getElementById('msgs');
      const elPrompt = document.getElementById('prompt-inp');

      elNtfy.value = localStorage.getItem('lux_ntfy') || 'lux-omega-kauan-v55';
      elUrl.value = localStorage.getItem('lux_url') || '';
      elRoute.value = localStorage.getItem('lux_route') || '/executar';

      function logMsg(txt, role) {
        const d = document.createElement('div');
        d.className = 'msg ' + (role === 'u' ? 'u' : 'a');
        d.textContent = txt;
        elMsgs.appendChild(d);
        elMsgs.scrollTop = elMsgs.scrollHeight;
        return d;
      }

      function refreshStatus() {
        const u = (localStorage.getItem('lux_url') || '').trim();
        elStatus.textContent = u ? ('Conectado: ' + u) : 'Sem URL configurada';
      }

      document.getElementById('btn-cfg').addEventListener('click', function () {
        elCfgBox.classList.toggle('open');
      });

      document.getElementById('btn-save').addEventListener('click', function () {
        const cleanU = elUrl.value.trim().replace(/\/+$/, '');
        const cleanR = (elRoute.value.trim() || '/executar');
        localStorage.setItem('lux_ntfy', elNtfy.value.trim() || 'lux-omega-kauan-v55');
        localStorage.setItem('lux_url', cleanU);
        localStorage.setItem('lux_route', cleanR.startsWith('/') ? cleanR : '/' + cleanR);
        elUrl.value = cleanU;
        elCfgBox.classList.remove('open');
        refreshStatus();
        logMsg('Configuração salva.', 'a');
      });

      document.getElementById('btn-sync').addEventListener('click', async function () {
        const ch = (elNtfy.value.trim() || 'lux-omega-kauan-v55');
        elStatus.textContent = 'Buscando no ntfy...';
        try {
          const r = await fetch('https://ntfy.sh/' + encodeURIComponent(ch) + '/json?poll=1&since=24h');
          const txt = await r.text();
          let found = null;
          for (const line of txt.split('
')) {
            if (!line.trim()) continue;
            const m = line.match(/https?:\/\/[a-zA-Z0-9.-]+\.(?:trycloudflare\.com|loca\.lt|ngrok-free\.app|ngrok\.io)|http:\/\/bore\.pub:\d+/g);
            if (m && m.length) found = m[m.length - 1];
          }
          if (found) {
            found = found.replace(/\/+$/, '');
            localStorage.setItem('lux_url', found);
            elUrl.value = found;
            refreshStatus();
            logMsg('URL encontrada: ' + found, 'a');
          } else {
            refreshStatus();
            logMsg('Nenhuma URL encontrada no canal ' + ch + '.', 'a');
          }
        } catch (err) {
          refreshStatus();
          logMsg('Erro ao sincronizar: ' + err.message, 'a');
        }
      });

      document.getElementById('btn-test').addEventListener('click', async function () {
        const u = (localStorage.getItem('lux_url') || elUrl.value || '').trim().replace(/\/+$/, '');
        if (!u) {
          logMsg('Informe ou sincronize uma URL primeiro.', 'a');
          return;
        }
        const b = logMsg('Testando ' + u + '/health ...', 'a');
        try {
          const r = await fetch(u + '/health');
          const t = await r.text();
          b.textContent = 'HTTP ' + r.status + ': ' + t;
        } catch (err) {
          b.textContent = 'Falha em /health: ' + err.message;
        }
      });

      async function sendNow() {
        const u = (localStorage.getItem('lux_url') || elUrl.value || '').trim().replace(/\/+$/, '');
        const rawRoute = (localStorage.getItem('lux_route') || elRoute.value || '/executar').trim();
        const route = rawRoute.startsWith('/') ? rawRoute : '/' + rawRoute;
        const prompt = elPrompt.value.trim();
        if (!prompt) return;
        if (!u) {
          logMsg('Configure ou sincronize a URL antes de enviar.', 'a');
          return;
        }
        logMsg(prompt, 'u');
        elPrompt.value = '';
        const replyBox = logMsg('Enviando...', 'a');
        try {
          const r = await fetch(u + route, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: prompt, message: prompt, text: prompt })
          });
          const data = await r.json();
          replyBox.textContent = data.reply || data.response || data.output || JSON.stringify(data, null, 2);
        } catch (err) {
          replyBox.textContent = 'Erro ao enviar: ' + err.message;
        }
      }

      document.getElementById('btn-send').addEventListener('click', sendNow);
      elPrompt.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          sendNow();
        }
      });

      refreshStatus();
    })();
  </script>
</body>
</html>
